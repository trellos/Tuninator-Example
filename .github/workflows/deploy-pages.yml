name: Deploy to GitHub Pages

# The demo depends on the published `tuninator` package from npm, so there is
# nothing to check out or build beyond this repo: `npm ci` brings the library
# and its prebuilt AudioWorklet asset in, and vite.config.ts copies the worklet
# out of the installed package.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment in flight; a newer push supersedes an in-progress one
# rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tuninator-example
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # Installs `tuninator` from npm at the version package-lock.json pins,
        # including its prebuilt dist/tuninator-worklet.js.
        run: npm ci

      - name: Build the demo
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
